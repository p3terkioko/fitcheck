name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync repo to /var/www/fitcheck
        run: |
          sudo mkdir -p /var/www/fitcheck
          sudo rsync -a --delete --exclude node_modules --exclude frontend/node_modules ./ /var/www/fitcheck/
          sudo chown -R deploy:deploy /var/www/fitcheck

      - name: Install Node dependencies (backend)
        run: |
          cd /var/www/fitcheck
          npm ci --omit=dev

      - name: Build frontend
        run: |
          cd /var/www/fitcheck/frontend
          cat > .env <<EOF
          VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL=https://fitcheck.works
          EOF
          npm ci
          npm run build

      - name: Deploy frontend
        run: |
          mkdir -p /home/deploy/fitcheck-frontend
          cp -r /var/www/fitcheck/frontend/dist/* /home/deploy/fitcheck-frontend/

      - name: Copy .env from server (centralized location)
        run: |
          cp /etc/fitcheck/.env /var/www/fitcheck/.env

      - name: Restart backend service
        run: |
          cd /var/www/fitcheck
          pm2 delete fitcheck-node 2>/dev/null || true
          pm2 start server.js --name fitcheck-node
          pm2 save

      - name: Restart ML service
        run: |
          cd /var/www/fitcheck
          pm2 delete fitcheck-ml 2>/dev/null || true
          pm2 start ./start-ml.sh --name fitcheck-ml
          pm2 save

      - name: Reload nginx
        run: sudo systemctl reload nginx
